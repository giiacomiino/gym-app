<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ACL → SKI PREP</title>
<meta name="description" content="Programa de fuerza post-LCA y preparación para esquí, octubre 2026 a febrero 2027.">
<meta name="theme-color" content="#0f1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ski Prep">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: columna de app (máx. 560px) con barra de pestañas fija abajo; cards por rol, no en todo. */
:root {
  --bg: #eef2f6;          /* nieve fría */
  --surface: #ffffff;
  --surface-2: #e3e9f0;
  --ink: #0f1b2a;         /* azul noche alpino */
  --muted: #586678;
  --line: #d3dbe5;
  --accent: #e2531b;      /* naranja de patrulla de esquí */
  --accent-ink: #ffffff;
  --accent-soft: #fbe3d8;
  --left: #e2531b;        /* pierna izquierda = LCA */
  --right: #2f6db3;       /* pierna derecha = azul pista */
  --ok: #1d8a4e; --warn: #c98a00; --bad: #cf3434;
  --ok-soft: #dcf1e5; --warn-soft: #fbefcf; --bad-soft: #fadcdc;
  --fig: #24364b; --fig-far: #9aa8b8; --prop: #8794a5; --prop-fill: #dfe5ec; --ground: #e6ebf1;
  --m1: #c9d3de; --m2: #f2b79c; --m3: #ed9771; --m4: #e77748; --m5: #d95b26; --m6: #b84413;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --shadow: 0 1px 2px rgb(15 27 42 / .06), 0 4px 14px rgb(15 27 42 / .06);
  --tabbar: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c141e; --surface: #142132; --surface-2: #1b2b40; --ink: #e8eef5; --muted: #93a3b6; --line: #24364b;
    --accent: #ff6a2e; --accent-ink: #1a0d06; --accent-soft: #3a2015; --left: #ff6a2e; --right: #63a3ea;
    --ok: #3cc47a; --warn: #f0b429; --bad: #ff6464; --ok-soft: #12321f; --warn-soft: #3a2f10; --bad-soft: #3d1717;
    --fig: #dbe4ee; --fig-far: #5d6f84; --prop: #6e7f94; --prop-fill: #22344a; --ground: #17263a;
    --m1: #2a3b51; --m2: #5a3424; --m3: #7c3d22; --m4: #a3461e; --m5: #cc531c; --m6: #ff6a2e;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c141e; --surface: #142132; --surface-2: #1b2b40; --ink: #e8eef5; --muted: #93a3b6; --line: #24364b;
  --accent: #ff6a2e; --accent-ink: #1a0d06; --accent-soft: #3a2015; --left: #ff6a2e; --right: #63a3ea;
  --ok: #3cc47a; --warn: #f0b429; --bad: #ff6464; --ok-soft: #12321f; --warn-soft: #3a2f10; --bad-soft: #3d1717;
  --fig: #dbe4ee; --fig-far: #5d6f84; --prop: #6e7f94; --prop-fill: #22344a; --ground: #17263a;
  --m1: #2a3b51; --m2: #5a3424; --m3: #7c3d22; --m4: #a3461e; --m5: #cc531c; --m6: #ff6a2e;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--font-body); -webkit-tap-highlight-color: transparent; }
body.locked { overflow: hidden; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .84rem; }
.center { text-align: center; }
.bad { color: var(--bad); }
.nw { white-space: nowrap; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.1; }
h2 { font-family: var(--font-display); font-size: 1.45rem; font-weight: 700; letter-spacing: .01em; }
h3 { font-size: 1rem; font-weight: 700; margin-top: 1.1rem; }
h3 small { font-weight: 500; }
.display { font-family: var(--font-display); font-weight: 800; font-size: 2.3rem; letter-spacing: .005em; text-transform: uppercase; }
.eyebrow { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
p { margin: .35rem 0; }

/* ---------- shell ---------- */
.topbar { background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 560px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: .03em; text-decoration: none; margin-right: auto; }
.brand b { color: var(--accent); }
.gear { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; text-decoration: none; }
main { max-width: 560px; margin: 0 auto; padding: 14px 16px calc(var(--tabbar) + 90px); display: flex; flex-direction: column; gap: 14px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { max-width: 560px; margin: 0 auto; height: var(--tabbar); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .68rem; font-weight: 600; letter-spacing: .02em; text-decoration: none; color: var(--muted); padding: 6px 0; }
.tabbar a.on { color: var(--ink); }
.tabbar a.on .ico { stroke: var(--accent); }
.tabbar .tab-today { position: relative; }
.tabbar .tab-today .bubble { width: 50px; height: 50px; margin-top: -26px; border-radius: 16px; background: var(--accent); display: grid; place-items: center; box-shadow: 0 6px 16px rgb(226 83 27 / .35); }
.tabbar .tab-today .bubble .ico { stroke: var(--accent-ink); fill: var(--accent-ink); }
.tabbar .tab-today.on { color: var(--accent); }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- componentes ---------- */
.card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); text-decoration: none; display: block; text-align: left; width: 100%; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 700; text-decoration: none; text-align: center; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-block { width: 100%; }
.btn .ico { width: 18px; height: 18px; }
.icon-btn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: var(--surface-2); font-size: 1.5rem; line-height: 1; text-decoration: none; flex: none; }
.chip { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); font-size: .74rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.chip-accent { background: var(--accent); color: var(--accent-ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; }
.pill .ico { width: 16px; height: 16px; }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill.big { font-size: 1rem; padding: 10px 16px; justify-content: center; }
.tag { display: inline-block; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); font-size: .72rem; font-weight: 600; color: var(--muted); }
.tag-uni { background: var(--accent-soft); color: var(--accent); }
.tag-sp { display: inline-flex; align-items: center; gap: 3px; background: var(--surface-2); color: var(--ink); }
.tag-sp .ico { width: 12px; height: 12px; fill: var(--accent); stroke: none; }
.meta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--muted); font-size: .86rem; margin: 6px 0 2px; }
.bar { height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); font-size: .92rem; text-align: left; width: 100%; }
.banner .ico { margin-top: 1px; }
.banner-red { background: var(--bad); color: #fff; font-weight: 800; letter-spacing: .02em; }
.banner-yellow { background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); }
.banner-pro { background: var(--ink); color: var(--bg); justify-content: center; text-align: center; letter-spacing: .03em; }
.banner-auth { background: var(--warn-soft); border-left: 4px solid var(--warn); }
.banner-ask { background: var(--accent-soft); }
.disclaimer { font-size: .78rem; color: var(--muted); text-align: center; margin: 4px 8px; }

/* piste (dificultad) */
.piste { display: inline-flex; align-items: center; gap: 5px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.piste svg { width: 15px; height: 15px; }
.piste-green svg { fill: #1d8a4e; } .piste-blue svg { fill: #2563b8; } .piste-black svg, .piste-dblack svg { fill: var(--ink); }

/* ---------- inicio ---------- */
.hero { padding: 6px 0 2px; }
.hero .display { font-size: 3.1rem; line-height: .95; margin: 4px 0 12px; }
.hero .arrow { color: var(--accent); }
.hero-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.hero-stats div { display: flex; flex-direction: column; }
.hero-stats b { font-size: 2rem; font-weight: 700; line-height: 1; }
.hero-stats span { font-size: .74rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.mountain { width: 100%; height: auto; display: block; margin: 4px 0 6px; }
.mountain .m-rehab { fill: var(--m1); } .m-f1 { fill: var(--m2); } .m-f2 { fill: var(--m3); } .m-f3 { fill: var(--m4); } .m-f4 { fill: var(--m5); } .m-f5 { fill: var(--m6); }
.m-ridge { fill: none; stroke: var(--ink); stroke-width: 1.4; opacity: .55; }
.m-lbl { font: 700 10px var(--font-display); fill: var(--muted); letter-spacing: .06em; }
.m-tick { font: 600 9.5px var(--font-body); fill: var(--muted); }
.m-now { fill: var(--surface); stroke: var(--ink); stroke-width: 2.5; }
.m-now-line { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 2; }
.m-now-lbl { font: 800 10px var(--font-display); fill: var(--ink); letter-spacing: .08em; text-transform: uppercase; }
.m-flag { fill: var(--accent); stroke: var(--ink); stroke-width: 1.2; }
.phase-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.today-card h2 { font-size: 1.7rem; margin: 6px 0 2px; }
.today-card .btn { margin-top: 12px; }
.today-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .big { font-size: 2.4rem; line-height: 1; }
.stat small { font-size: 1.1rem; color: var(--muted); }
.knee-card { display: flex; gap: 14px; align-items: center; }
.knee-card b { display: block; font-size: 1.1rem; }
.knee-dots { display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 10px; background: var(--ink); }
.knee-dots i { width: 14px; height: 14px; border-radius: 50%; opacity: .22; }
.knee-dots .g { background: #2fbf6a; } .knee-dots .y { background: #f5b800; } .knee-dots .r { background: #f04545; }
.light-green .knee-dots .g, .light-yellow .knee-dots .y, .light-red .knee-dots .r { opacity: 1; box-shadow: 0 0 10px currentColor; }
.next-row { display: flex; align-items: center; justify-content: space-between; margin: 4px 0; font-size: 1.1rem; }
.ticks { margin: 8px 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.ticks li { padding-left: 22px; position: relative; }
.ticks li::before { content: ""; position: absolute; left: 2px; top: .5em; width: 10px; height: 6px; border-left: 2.5px solid var(--accent); border-bottom: 2.5px solid var(--accent); transform: rotate(-45deg); }
.miles { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; }
.mile { display: grid; grid-template-columns: 58px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: .93rem; }
.mile:first-child { border-top: 0; }
.mile-date { font-weight: 700; font-size: 1.05rem; }
.mile-pro span:last-child { font-weight: 700; }
.mile-goal .mile-date, .mile-goal span:last-child { color: var(--accent); font-weight: 800; }
.link-card { display: flex; flex-direction: column; gap: 4px; }
.link-card .ico { stroke: var(--accent); width: 26px; height: 26px; }

/* ---------- encabezados de página ---------- */
.page-head { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.page-head .seg { margin-top: 8px; }
.seg { display: inline-grid; grid-auto-flow: column; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button, .seg label span { padding: 8px 16px; border-radius: 9px; font-weight: 700; font-size: .9rem; display: block; text-align: center; }
.seg button.on, .seg input:checked + span { background: var(--surface); box-shadow: var(--shadow); }
.seg input { position: absolute; opacity: 0; }
.seg label { position: relative; cursor: pointer; }
.seg-wide { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; }

/* ---------- calendario ---------- */
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.week-list { display: flex; flex-direction: column; gap: 8px; }
.day-row { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: var(--r); background: var(--surface); text-decoration: none; box-shadow: var(--shadow); border-left: 4px solid transparent; }
.day-row.kind-gym { border-left-color: var(--accent); } .day-row.kind-kb { border-left-color: var(--right); } .day-row.kind-recovery { border-left-color: var(--ok); }
.day-row.kind-rest, .day-out { box-shadow: none; background: transparent; border: 1px dashed var(--line); }
.day-row.st-today { outline: 2px solid var(--ink); }
.day-date { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.day-date span { font-size: .7rem; font-weight: 700; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
.day-date b { font-size: 1.6rem; }
.day-main b { display: block; }
.status { font-size: .72rem; font-weight: 700; color: var(--muted); display: inline-flex; align-items: center; gap: 3px; text-align: right; }
.status .ico { width: 14px; height: 14px; }
.status.st-done { color: var(--ok); } .status.st-today { color: var(--accent); } .status.st-missed { color: var(--warn); }
.month { background: var(--surface); border-radius: var(--r); padding: 10px; box-shadow: var(--shadow); }
.month-head, .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.month-head span { text-align: center; font-size: .72rem; font-weight: 700; color: var(--muted); padding: 4px 0; }
.mcell { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; position: relative; background: var(--surface-2); max-width: 100%; }
.mcell b { font-size: 1.05rem; }
.mcell.empty, .mcell.out { background: transparent; color: var(--muted); opacity: .5; }
.mcell.is-today { outline: 2px solid var(--ink); }
.mcell.st-done { background: var(--ok-soft); }
.mcell .tick { position: absolute; top: 3px; right: 5px; font-style: normal; font-size: .7rem; color: var(--ok); font-weight: 800; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--fig-far); }
.kind-gym .dot, .dot.kind-gym { background: var(--accent); } .kind-kb .dot, .dot.kind-kb { background: var(--right); } .kind-recovery .dot, .dot.kind-recovery { background: var(--ok); } .kind-travel .dot { background: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- día ---------- */
.day-nav { display: flex; align-items: center; justify-content: space-between; }
.day-head .display { font-size: 2.1rem; }
.meta-strip { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-weight: 600; font-size: .9rem; }
.meta-strip span { display: inline-flex; align-items: center; gap: 5px; }
.meta-strip .ico { width: 17px; height: 17px; }
.knee-row { display: flex; flex-direction: column; gap: 8px; }
.knee-pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.kpill { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; border-radius: 10px; background: var(--surface); box-shadow: var(--shadow); font-size: .84rem; font-weight: 700; }
.kpill i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.kpill.light-green i { background: #2fbf6a; } .kpill.light-yellow i { background: #f5b800; } .kpill.light-red i { background: #f04545; }
.block { display: flex; flex-direction: column; gap: 8px; }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.block-head h2 { display: inline-flex; align-items: center; gap: 8px; }
.block-hint { margin: -4px 0 0; }
.rest-btn { display: inline-flex; align-items: center; gap: 5px; padding: 7px 11px; border-radius: 10px; background: var(--surface-2); font-size: .8rem; font-weight: 700; }
.rest-btn .ico { width: 16px; height: 16px; }
.warm { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.warm-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-top: 1px solid var(--line); }
.warm-row:first-child { border-top: 0; }
.warm-txt { display: flex; justify-content: space-between; gap: 8px; flex: 1; text-align: left; min-height: 36px; align-items: center; }
.warm-txt span { color: var(--muted); font-size: .88rem; }
.is-done .warm-txt b { text-decoration: line-through; color: var(--muted); }
.item { display: grid; grid-template-columns: 1fr auto; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.item.is-done { background: color-mix(in srgb, var(--ok-soft) 55%, var(--surface)); }
.item-main { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 10px; text-align: left; align-items: center; }
.item-thumb { width: 84px; height: 62px; border-radius: 10px; background: var(--ground); display: block; overflow: hidden; }
.item-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.item-txt b { font-size: 1.02rem; line-height: 1.2; }
.item-top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.code { font-family: var(--font-display); font-weight: 800; font-size: .95rem; color: var(--accent); letter-spacing: .04em; }
.rx { font-size: .86rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.logged { font-size: .8rem; font-weight: 700; color: var(--ok); }
.note { font-size: .78rem; color: var(--muted); font-style: italic; }
.item-side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px 12px 10px 0; }
.check { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); display: grid; place-items: center; background: var(--surface); flex: none; }
.check .ico { opacity: 0; stroke-width: 3; }
.check.on { background: var(--ok); border-color: var(--ok); }
.check.on .ico { opacity: 1; stroke: #fff; }
.check.sm { width: 34px; height: 34px; border-radius: 9px; }
.mini-btn { font-size: .74rem; font-weight: 700; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); }
.block-ski .block-head h2 .ico { stroke: var(--accent); }
.block-auth { border: 2px dashed var(--warn); border-radius: var(--r); padding: 12px; }

.fg-left { stroke: var(--left); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fg-knee { fill: var(--surface); stroke: var(--left); stroke-width: 1.6; }
.fg-head { fill: var(--surface); stroke: var(--fig); stroke-width: 3; }

.fg-wheel { fill: none; stroke: var(--prop); stroke-width: 3; }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgb(8 14 22 / .55); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-height: 92vh; max-height: 92dvh; display: flex; justify-content: center; }
.sheet-body { width: 100%; max-width: 560px; background: var(--bg); border-radius: 20px 20px 0 0; overflow-y: auto; overscroll-behavior: contain; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }

/* registro de series */
.set-head, .set-line { display: grid; grid-template-columns: 34px repeat(3, 1fr); gap: 6px; align-items: center; }
.set-head { font-size: .72rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; text-align: center; padding-left: 34px; grid-template-columns: repeat(3, 1fr); }

.legend-lights i { width: 12px; height: 12px; border-radius: 50%; flex: none; margin-top: 4px; }
.legend-lights .g { background: #2fbf6a; } .legend-lights .y { background: #f5b800; } .legend-lights .r { background: #f04545; }

/* ---------- gráficas ---------- */

.c-wrap { position: relative; }
.chart svg { width: 100%; height: auto; display: block; }

.c-right.c-line { stroke: var(--right); } .c-right.c-area, .c-right.c-pt { fill: var(--right); } .c-right.c-val { fill: var(--right); }

.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.table-wrap { overflow-x: auto; }
